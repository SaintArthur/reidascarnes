      --bp-text: #ffffff;

      --bp-text-muted: #8b9bb4;
      --bp-text-faint: #6b7280;
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bp-bg: #f3f1ec;
      --bp-panel: #ffffff;
      --bp-card: #f1eee6;
      --bp-border: #e1dccf;
      --bp-border2: #d6cfba;
      --bp-text: #1c1a16;
      --bp-text-secondary: #3f3b33;
      --bp-text-muted: #6b6558;
      --bp-text-faint: #8a8374;
      color-scheme: light;
    }

    [data-theme="light"] .text-white { color: var(--bp-text) !important; }
    [data-theme="light"] .text-gray-300 { color: var(--bp-text-secondary) !important; }
    [data-theme="light"] .text-gray-400 { color: var(--bp-text-muted) !important; }
    [data-theme="light"] .text-gray-500 { color: var(--bp-text-muted) !important; }
    [data-theme="light"] .text-gray-600 { color: var(--bp-text-faint) !important; }
    [data-theme="light"] .text-gray-700 { color: var(--bp-text-faint) !important; }
    [data-theme="light"] .bg-gray-700 { background-color: var(--bp-border2) !important; }
    [data-theme="light"] .bg-gray-800 { background-color: var(--bp-card) !important; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      background: var(--bp-bg);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    h1,
    h2,
    h3,
    .syne {
      font-family: 'Syne', sans-serif;
    }

    .mono {
      font-family: 'DM Mono', monospace;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-20px)
      }

      to {
        opacity: 1;
        transform: translateX(0)
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(20px)
      }

      to {
        opacity: 1;
        transform: translateX(0)
      }
    }

    @keyframes carouselProgress {
      from {
        transform: scaleX(0)
      }

      to {
        transform: scaleX(1)
      }
    }

    .login-card {
      animation: fadeUp .7s ease forwards;
    }

    .panel {
      background: linear-gradient(145deg, var(--bp-card) 0%, var(--bp-panel) 100%);
      border: 1px solid var(--bp-border2);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      left: auto;
      z-index: 2000;
      animation: slideInRight .3s ease;
      max-width: 380px;
    }

    @media (max-width: 480px) {
      .toast {
        left: 16px !important;
        right: 16px !important;
        bottom: 16px !important;
        max-width: none !important;
      }
    }

    .sidebar {
      animation: slideInLeft .3s ease;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .75);
      z-index: 1000;
      backdrop-filter: blur(6px);
    }

    .nav-link.active {
      color: #d4a574;
    }

    /* ===== REPORTS STYLES ===== */

    .rpt-table th {
      color: var(--bp-text-faint);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--bp-border);
      text-align: left;
      white-space: nowrap;
    }

    .rpt-table td {
      padding: 12px 12px;
      border-bottom: 1px solid var(--bp-border);
      color: var(--bp-text-secondary);
      vertical-align: middle;
    }

    .rpt-table tr:last-child td {
      border-bottom: none;
    }

    .rpt-table tbody tr:hover td {
      background: rgba(212, 165, 116, 0.04);
    }

    @media (max-width: 900px) {

    }

    @media (max-width: 560px) {
    }

    /* ===== NOTIFICATION CENTER ===== */
    @keyframes notifSlideIn {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes notifPulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(212, 165, 116, .5);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(212, 165, 116, 0);
      }
    }

    @keyframes bellShake {

      0%,
      100% {
        transform: rotate(0);
      }

      20% {
        transform: rotate(-12deg);
      }

      40% {
        transform: rotate(10deg);
      }

      60% {
        transform: rotate(-8deg);
      }

      80% {
        transform: rotate(6deg);
      }
    }

    .notif-panel {
      animation: notifSlideIn .2s ease forwards;
      position: fixed;
      top: 68px;
      right: 12px;
      width: min(400px, calc(100vw - 24px));
      max-height: min(540px, calc(100dvh - 80px));
      background: #111827;
      border: 1px solid var(--bp-border);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .7);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 500;
    }

    @media (max-width: 480px) {
      .notif-panel {
        right: 8px;
        left: 8px;
        width: auto;
        border-radius: 12px;
      }
    }

    .notif-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      background: #ef4444;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      color: var(--bp-text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 2px solid var(--bp-bg);
      animation: notifPulse 2s infinite;
    }

    .notif-bell-active {
      animation: bellShake .6s ease;
    }

    .notif-item {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--bp-border);
      cursor: pointer;
      transition: background .15s;
    }

    .notif-item:hover {
      background: rgba(255, 255, 255, .03);
    }

    .notif-item:last-child {
      border-bottom: none;
    }

    .notif-item.unread {
      background: rgba(212, 165, 116, .04);
    }

    .notif-item.unread:hover {
      background: rgba(212, 165, 116, .08);
    }

    .notif-icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .notif-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d4a574;
      flex-shrink: 0;
      margin-top: 6px;
    }

    .notif-tab {
      background: none;
      border: none;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      border-bottom: 2px solid transparent;
      transition: all .15s;
      color: var(--bp-text-faint);
    }

    .notif-tab.active {
      color: #d4a574;
      border-bottom-color: #d4a574;
    }

    .notif-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: #4b5563;
    }

    /* ===== DRUM TIME PICKER ===== */
    .drum-col {
      height: 200px;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      position: relative;
    }
    .drum-col::-webkit-scrollbar { display: none; }
    .drum-item {
      height: 40px;
      scroll-snap-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
      font-size: 20px;
      font-weight: 600;
      color: #4b5563;
      transition: color .15s, transform .15s;
      cursor: default;
      user-select: none;
    }
    .drum-item.selected {
      color: var(--bp-text);
      font-size: 22px;
    }
    .drum-highlight {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 40px;
      transform: translateY(-50%);
      background: rgba(212,165,116,0.1);
      border-top: 1px solid rgba(212,165,116,0.3);
      border-bottom: 1px solid rgba(212,165,116,0.3);
      border-radius: 6px;
      pointer-events: none;
    }
    .drum-fade-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(to bottom, var(--bp-card) 0%, transparent 100%);
      pointer-events: none;
      z-index: 2;
    }
    .drum-fade-bot {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(to top, var(--bp-card) 0%, transparent 100%);
      pointer-events: none;
      z-index: 2;
    }

    @media (max-width: 640px) {
      .admin-hamburger,
      .sidebar-hamburger {
        display: block !important;
      }
    }

    /* ===== REVIEWS STYLES ===== */
    .rv-panel {

      border: 1px solid var(--bp-border);

      background: var(--bp-border);

    .rv-gauge-fill {
      height: 100%;

      background: linear-gradient(90deg, #d4a574, #f59e0b);

    .rv-card {

    /* Perfil do cliente (avatar | campos) precisa de mais espaço que o breakpoint mobile geral
       de 640px pra cada campo não ficar espremido — em telas entre 640px e ~860px os campos
       ficavam com largura real de menos de 100px e cortavam o texto (ex: e-mail, telefone). */
    @media (max-width: 860px) {
      .cp-grid-top { grid-template-columns: 1fr !important; }
    }

    /* ============================================================
       MOBILE PEQUENO — max-width: 480px
    ============================================================ */
    @media (max-width: 480px) {

      /* KPI cards: 1 por linha em telas muito pequenas */
      .admin-kpi-grid { grid-template-columns: 1fr 1fr !important; }

      /* Login sem padding lateral */
      .login-card { padding: 20px 14px !important; }

      /* Booking steps: só ícone */

      /* Charts: 1 coluna */
      .admin-charts-grid { grid-template-columns: 1fr !important; }

      /* Modais: full width */
      .modal-overlay > div { width: calc(100vw - 16px) !important; max-width: 100% !important; }

      /* Drum picker mais compacto */
      .drum-col { height: 140px !important; }
      .drum-item { height: 28px !important; font-size: 16px !important; }
      .drum-highlight { height: 28px !important; }

      /* ClientProfile grids: sempre 1 coluna */
      .cp-grid-top { grid-template-columns: 1fr !important; }

      /* Reports tabela */

      /* Topbar admin: ocultar extras */
      .admin-topbar-search { display: none !important; }
    }

    /* ── Touch: remover hover effects em mobile ── */
    @media (hover: none) {
      button:hover { opacity: 1 !important; }
    }

    /* ── Scroll suave no mobile ── */
    * { -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }

    /* ── Inputs no mobile: fonte >= 16px para evitar zoom ── */
    @media (max-width: 768px) {
      input, textarea, select {
        font-size: 16px !important;
      }
    }

  </style>
</head>

<body>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        if (!stored) {
          var u = localStorage.getItem('user');
          if (u) stored = JSON.parse(u).theme;
        }
        document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark');
      } catch (e) {}
    })();
  </script>
  <div id="root">
    <div id="boot-status" style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#8b9bb4;font-family:'Inter',sans-serif;font-size:14px;">
      Carregando...
    </div>
  </div>
  <script>
    (function () {
      // Sem tratamento de erro aqui, uma falha em qualquer CDN (React/Babel/Tailwind) ou nos
      // arquivos .jsx (rede lenta, firewall bloqueando um domínio externo, etc.) deixava a tela
      // preta pra sempre, sem nenhuma indicação do que aconteceu — problema real observado em
      // rede móvel e em uma rede corporativa. Agora mostra uma mensagem clara com botão de
      // tentar de novo em vez de travar em silêncio.
      function showBootError(msg) {
        var el = document.getElementById('boot-status');
        if (!el) return;
        el.innerHTML = '<div style="text-align:center;max-width:320px;padding:24px;">' +
          '<div style="font-size:28px;margin-bottom:12px;">⚠️</div>' +
          '<div style="color:#fff;font-weight:600;margin-bottom:8px;">Não foi possível carregar o sistema</div>' +
          '<div style="font-size:13px;margin-bottom:16px;">' + msg + '</div>' +
          '<button onclick="location.reload()" style="background:#d4a574;color:#000;border:none;border-radius:8px;padding:10px 20px;font-weight:600;cursor:pointer;">Tentar novamente</button>' +
          '</div>';
      }

      var bootTimeout = setTimeout(function () {
        showBootError('A conexão está demorando mais que o esperado. Verifique sua internet e tente novamente.');
      }, 15000);

      if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' || typeof Babel === 'undefined') {
        clearTimeout(bootTimeout);
        showBootError('Alguns recursos não puderam ser carregados. Verifique sua conexão com a internet e tente novamente.');
        return;
      }

      var files = ['js/utils.jsx', 'js/login.jsx', 'js/acougue.jsx', 'js/app.jsx'];
      Promise.all(files.map(f => fetch(f).then(r => {
        if (!r.ok) throw new Error('Falha ao carregar ' + f);
        return r.text();
      })))
        .then(sources => {
          clearTimeout(bootTimeout);
          sources.forEach(src => {
            var compiled = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
            var s = document.createElement('script');
            s.textContent = compiled;
            document.body.appendChild(s);
          });
        })
        .catch(err => {
          clearTimeout(bootTimeout);
          showBootError('Verifique sua conexão com a internet e tente novamente.');
          console.error('Erro ao carregar o sistema:', err);
        });
    })();
  </script>
</body>

</html>
